name: Validate Workspace

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v3
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install root dependencies
        run: pnpm install --ignore-workspace

      - name: Setup workspace
        run: pnpm run dev-setup --preset full

      - name: Build affected
        run: pnpm turbo run build --affected

      - name: Type-check affected
        run: pnpm turbo run typecheck --affected

      - name: Test affected
        id: test
        continue-on-error: true
        run: pnpm turbo run test --affected --filter='!@quartz-themes/core'

      - name: Lint affected
        run: pnpm turbo run lint --affected

      - name: Validate workspace
        run: pnpm validate

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build E2E fixtures
        run: |
          pnpm tsx e2e/helpers/build-fixture.ts base-url-site
          pnpm tsx e2e/helpers/build-fixture.ts nested-base-url
          pnpm tsx e2e/helpers/build-fixture.ts bug-repro
          pnpm tsx e2e/helpers/build-fixture.ts footer-disabled

      - name: Run E2E tests
        run: pnpm exec playwright test --config e2e/playwright.config.ts
        env:
          CI: "true"

      - name: Check test results
        if: steps.test.outcome == 'failure'
        run: |
          echo "::error::Test step failed — see 'Test affected' step above for details"
          exit 1
